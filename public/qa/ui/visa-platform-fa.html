<!doctype html>
<html lang="fa" dir="rtl" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>QA · فرم امن eVisa</title>
  <link rel="preload" href="/assets/Vazirmatn.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/platform-1010.css">
</head>
<body class="travel-site">
  <main class="travel-main">
    <section class="application-shell">
      <article class="application-card">
        <span class="platform-eyebrow">eVisa · پروندهٔ نمونه</span>
        <h1>فرم امن اطلاعات ویزا</h1>
        <p>اطلاعات هویتی و گذرنامه فقط برای بررسی پرونده رمزنگاری می‌شوند و پس از ثبت در این سطح نمایش داده نمی‌شوند.</p>
        <div class="platform-alert">این یک صفحهٔ QA است؛ هیچ داده‌ای ارسال یا ذخیره نمی‌شود.</div>
        <form class="application-form">
          <fieldset class="application-fieldset">
            <legend>هویت مطابق گذرنامه</legend>
            <div class="application-fields">
              <label>نام<input autocomplete="given-name" value="نام نمونه"></label>
              <label>نام خانوادگی<input autocomplete="family-name" value="نام خانوادگی نمونه"></label>
              <label>تاریخ تولد<input type="date" dir="ltr" value="1990-06-14"></label>
              <label>تابعیت<select><option>ایران</option><option>روسیه</option></select></label>
            </div>
          </fieldset>
          <fieldset class="application-fieldset">
            <legend>گذرنامه و برنامه سفر</legend>
            <div class="application-fields">
              <label>شماره گذرنامه<input class="ltr-value" dir="ltr" value="P12345678" autocomplete="off"></label>
              <label>تاریخ انقضا<input type="date" dir="ltr" value="2031-09-30"></label>
              <label>کشور مقصد<input value="روسیه"></label>
              <label>تاریخ ورود<input type="date" dir="ltr" value="2026-10-04"></label>
              <label class="wide">هدف سفر<textarea>گردشگری و بازدید از خانواده</textarea></label>
            </div>
          </fieldset>
          <label class="application-consent"><input type="checkbox" checked><span>صحت اطلاعات و پردازش رمزنگاری‌شدهٔ آن را تأیید می‌کنم.</span></label>
          <div class="platform-inline-actions"><button class="primary" type="button">ثبت امن فرم eVisa</button><a href="#" dir="ltr">VZABC1234567</a></div>
        </form>
      </article>
    </section>
  </main>
</body>
</html>
